[workspace]
resolver = "2"
members = [
    "crates/gex-abi",
    "crates/gex-atomic",
    "crates/gex-cache",
    "crates/gex-key",
    "crates/gex-mem",
    "crates/gex-isa",
    "crates/gex-isa-x86",
    "crates/gex-ir",
    "crates/gex-f80",
    "crates/gex-lift",
    "crates/gex-lift-x86",
    "crates/gex-emit",
    "crates/gex-cgen",
    "crates/gex-split",
    "crates/gex-units",
    "crates/gex-dylink",
    "crates/gex-fjit",
    "crates/gex-kmem",
    "hosts/kernel",
    "crates/gex-xlate",
    "crates/gex-ld",
    "crates/gex-kernel",
    "crates/gex-wayland",
    "crates/gex-xwm",
    "crates/gex-gpu",
    "crates/gex-gl",
    "crates/gex-eject",
    "crates/gexc",
    "hosts/browser",
    "hosts/hostwl",
    "hosts/native",
]
# WebMetal and AirWgsl are pinned submodules with workspaces (and manifests)
# of their own; gexc builds them as dependencies (its `webmetal` feature).
# The page's GPU Worker (hosts/metal) builds WebMetal's browser binding, which
# pins its wasm-bindgen exactly: it is a workspace of its own, so that the pin
# does not hold this workspace's other wasm crates.
exclude = ["third_party/WebMetal", "third_party/AirWgsl", "hosts/metal"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.96"
license = "AGPL-3.0-only"
repository = "https://github.com/HeyPuter/gex"

[workspace.dependencies]
gex-atomic = { path = "crates/gex-atomic" }
gex-abi = { path = "crates/gex-abi" }
gex-cache = { path = "crates/gex-cache", default-features = false }
gex-key = { path = "crates/gex-key" }
gex-mem = { path = "crates/gex-mem" }
gex-wayland = { path = "crates/gex-wayland" }
gex-xwm = { path = "crates/gex-xwm" }
gex-gpu = { path = "crates/gex-gpu" }
gex-gl = { path = "crates/gex-gl", default-features = false }
gex-isa = { path = "crates/gex-isa" }
gex-isa-x86 = { path = "crates/gex-isa-x86" }
gex-ir = { path = "crates/gex-ir" }
gex-dylink = { path = "crates/gex-dylink" }
gex-f80 = { path = "crates/gex-f80" }
gex-lift = { path = "crates/gex-lift" }
gex-lift-x86 = { path = "crates/gex-lift-x86" }
gex-emit = { path = "crates/gex-emit" }
gex-cgen = { path = "crates/gex-cgen" }
gex-split = { path = "crates/gex-split" }
gex-units = { path = "crates/gex-units" }
gex-fjit = { path = "crates/gex-fjit" }
gex-kmem = { path = "crates/gex-kmem" }
gex-xlate = { path = "crates/gex-xlate" }
gex-ld = { path = "crates/gex-ld" }
gex-kernel = { path = "crates/gex-kernel" }
gex-native = { path = "hosts/native", default-features = false }
gex-eject = { path = "crates/gex-eject", default-features = false }

[profile.release]
opt-level = 3
debug = 1

# wasmtime 49 with one change (third_party/wasmtime-49.0.2/src/runtime/store.rs,
# `wasm_fault`): several instances claiming one shared memory is not an
# assertion failure. Every module import of the guest's SharedMemory creates
# such an instance, so without it a guest fault in a guard page panicked the
# host instead of reaching the guest as SIGSEGV / an access violation.
[patch.crates-io]
wasmtime = { path = "third_party/wasmtime-49.0.2" }

# WebMetal's executor takes AirWgsl at a commit of its public repository;
# the submodule is that commit.
[patch."https://github.com/MovByte/AirWgsl"]
airwgsl = { path = "third_party/AirWgsl" }
