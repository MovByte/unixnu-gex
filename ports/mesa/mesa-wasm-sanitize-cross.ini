[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
strip = 'emstrip'
pkg-config = 'false'

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'

[properties]
needs_exe_wrapper = true

# This is deliberately a separate build from the release artifacts.  ASan
# catches use-after-free/out-of-bounds accesses in Mesa and the Gallium driver;
# UBSan catches invalid shifts, alignment, integer and pointer operations that
# can otherwise turn into nondeterministic Wasm corruption.  Keep frame
# pointers and do not enable either full or ThinLTO: useful reports matter more
# than code size in this configuration.
[built-in options]
c_args = ['-D_GNU_SOURCE', '-D_POSIX_C_SOURCE=200809L', '-pthread', '-fsanitize=address,undefined', '-fno-sanitize=alignment', '-fno-omit-frame-pointer']
cpp_args = ['-D_GNU_SOURCE', '-D_POSIX_C_SOURCE=200809L', '-pthread', '-fsanitize=address,undefined', '-fno-sanitize=alignment', '-fno-omit-frame-pointer']
c_link_args = ['-fsanitize=address,undefined']
cpp_link_args = ['-fsanitize=address,undefined']
