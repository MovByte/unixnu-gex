# The single-thread build's: as mesa-wasm-cross.ini
# without -pthread, so the module's memory is not shared and it runs in a
# page that is not cross-origin isolated. Mesa follows the cross file
# (-Dgex-wasm-threads=auto): no glthread, no driver thread.
[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
strip = 'emstrip'
pkg-config = 'false'

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'

[properties]
needs_exe_wrapper = true

# SIMD and ThinLTO, and binaryen at -O3 when linking (emcc runs it for a
# linking -O3).
[built-in options]
c_args = ['-D_GNU_SOURCE', '-D_POSIX_C_SOURCE=200809L', '-msimd128', '-flto=thin']
cpp_args = ['-D_GNU_SOURCE', '-D_POSIX_C_SOURCE=200809L', '-msimd128', '-flto=thin']
c_link_args = ['-msimd128', '-flto=thin', '-O3']
cpp_link_args = ['-msimd128', '-flto=thin', '-O3']
